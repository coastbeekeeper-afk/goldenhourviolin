<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Golden Hour Violin</title>
  <meta name="description" content="This page is not part of the Golden Hour Violin site.">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f4efe6">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #f4efe6;
      color: #241c16;
      font-family: "Segoe UI", sans-serif;
    }
    main {
      flex: 1;
      display: grid;
      align-content: center;
      width: min(40rem, calc(100% - 2.5rem));
      margin: 0 auto;
      padding: 4rem 0;
    }
    p { line-height: 1.6; }
    .eyebrow {
      margin: 0 0 0.8rem;
      color: #6b5340;
      font-size: 0.75rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 500;
      font-size: clamp(3rem, 8vw, 5rem);
      line-height: 0.95;
    }
    a {
      color: inherit;
    }
    .home {
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      margin-top: 1.5rem;
      padding: 0.85rem 1.3rem;
      background: #2a211b;
      color: #f4efe6;
      font-size: 0.75rem;
      letter-spacing: 0.16em;
      text-decoration: none;
      text-transform: uppercase;
    }
    :focus-visible { outline: 2px solid #8d6233; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Golden Hour Violin</p>
    <h1>Page not found</h1>
    <p>That address is not part of this site.</p>
    <a class="home" id="home" href="/">Back to the site</a>
  </main>
  <script>
    (function () {
      var home = "/";
      if (location.hostname.endsWith("github.io")) {
        var part = location.pathname.split("/").filter(Boolean)[0];
        if (part) home = "/" + part + "/";
      }
      document.getElementById("home").setAttribute("href", home);
    })();
  </script>
</body>
</html>
